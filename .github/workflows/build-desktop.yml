name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            zip_name: PretestAnalyzer-mac.zip
          - os: windows-latest
            zip_name: PretestAnalyzer-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "PretestAnalyzer" \
            --add-data "static:static" \
            --collect-all pyreadstat \
            --collect-all statsmodels \
            --collect-submodules scipy \
            --hidden-import "openpyxl" \
            desktop_app.py
          cd dist && zip -r "../${{ matrix.zip_name }}" PretestAnalyzer.app

      - name: Construir (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "PretestAnalyzer" `
            --add-data "static;static" `
            --collect-all pyreadstat `
            --collect-all statsmodels `
            --collect-submodules scipy `
            --hidden-import "openpyxl" `
            desktop_app.py
          Compress-Archive -Path "dist/PretestAnalyzer/*" -DestinationPath "${{ matrix.zip_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PretestAnalyzer-mac.zip/PretestAnalyzer-mac.zip
            PretestAnalyzer-windows.zip/PretestAnalyzer-windows.zip
